<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Business Analytics Student Survey</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Bootstrap 5 (for quick spacing/center helpers) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* keeps the card centered and sized like the wireframe */
    .survey-wrap { min-height: 100vh; display: grid; place-items: center; }
    .survey-card {
      max-width: 420px;
      width: 92%;
      border: 1px solid #cfcfcf;
      border-radius: 8px;
      padding: 2.25rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.75rem;
    }
    .survey-title { text-align: center; line-height: 1.2; }
    .survey-body p { margin: 0 0 1.25rem 0; }
    .survey-footer { margin-top: auto; text-align: center; }
  </style>
</head>
<body>
  <main class="survey-wrap">
    <section class="survey-card" aria-labelledby="survey-title">
      <header>
        <h1 id="survey-title" class="h3 survey-title">
          Business Analytics<br>Student Survey
        </h1>
      </header>

      <div class="survey-body">
        <p>This survey should take you less than a minute to complete and I would be greaful if you filled it out.</p>
        <p>
          The BAIS department will use the results to better understand the BAIS
          student population.
        </p>
      </div>

      <div class="survey-footer">
        <a class="btn btn-outline-dark btn-lg px-4" href="form.html">
          Start survey
        </a>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
