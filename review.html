<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>HW9 – Review & confirmation Page </title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <main class="container my-4">
    <h1>Review your info</h1>
    <div id="review" class="mt-3"></div>
    <div class="mt-4 d-flex gap-2">
      <a class="btn btn-outline-secondary" href="form.html">Edit</a>
      <a class="btn btn-success" href="thanks.html">Confirm & Submit</a>
    </div>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const review = document.getElementById('review');
    const rows = [['Name', 'name'], ['Email', 'email'], ['Topic', 'topic'], ['Message', 'message']];
    review.innerHTML = `
      <table class="table table-bordered">
        <tbody>
          ${rows.map(([label, key]) => `
            <tr><th scope="row">${label}</th><td>${(params.get(key)||'').toString()}</td></tr>
          `).join('')}
        </tbody>
      </table>`;
  </script>
</body>
</html>
