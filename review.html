<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>BAIS Survey — Page 2 of 2</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>.shell{max-width:640px}</style>
</head>
<body>
  <main class="container my-4 shell">
    <h1 class="h3 text-center mb-4">Business Analytics<br>Student Survey</h1>

    <form id="p2form" action="hawkid_ty.html" method="get" class="needs-validation" novalidate>
      <!-- carry forward all page-1 answers as hidden fields -->
      <div id="carry" aria-hidden="true"></div>

      <!-- Year (required) -->
      <fieldset class="mb-3">
        <legend class="form-label">
          I am finishing my <span class="text-danger">Required field</span>
        </legend>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="year" id="y1" value="first year" required>
          <label class="form-check-label" for="y1">first year at Iowa</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="year" id="y2" value="second year" required>
          <label class="form-check-label" for="y2">second year at Iowa</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="year" id="y3" value="third year" required>
          <label class="form-check-label" for="y3">third year at Iowa</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="year" id="y4" value="fourth year" required>
          <label class="form-check-label" for="y4">fourth year at Iowa</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="year" id="y5" value="fifth or more" required>
          <label class="form-check-label" for="y5">fifth or more year at Iowa</label>
        </div>
        <div class="invalid-feedback d-block" id="yearFeedback" style="display:none">Please choose an option.</div>
      </fieldset>

      <!-- BAIS core classes (at least one required) -->
      <fieldset class="mb-3">
        <legend class="form-label">
          BAIS core class I have completed <span class="text-danger">Required field</span>
        </legend>
        <div class="row row-cols-1 row-cols-md-2 g-2">
          <!-- name=bais_core for all; multiple values are allowed in query string -->
          <div class="col"><div class="form-check">
            <input class="form-check-input core" type="checkbox" id="c1" name="bais_core" value="Information Systems">
            <label class="form-check-label" for="c1">Information Systems</label>
          </div></div>
          <div class="col"><div class="form-check">
            <input class="form-check-input core" type="checkbox" id="c2" name="bais_core" value="Operations">
            <label class="form-check-label" for="c2">Operations</label>
          </div></div>
          <div class="col"><div class="form-check">
            <input class="form-check-input core" type="checkbox" id="c3" name="bais_core" value="Foundations of Business Analytics">
            <label class="form-check-label" for="c3">Foundations of Business Analytics</label>
          </div></div>
          <div class="col"><div class="form-check">
            <input class="form-check-input core" type="checkbox" id="c4" name="bais_core" value="Computational Thinking">
            <label class="form-check-label" for="c4">Computational Thinking</label>
          </div></div>
          <div class="col"><div class="form-check">
            <input class="form-check-input core" type="checkbox" id="c5" name="bais_core" value="Database Management">
            <label class="form-check-label" for="c5">Database Management</label>
          </div></div>
          <div class="col"><div class="form-check">
            <input class="form-check-input core" type="checkbox" id="c6" name="bais_core" value="Data Wrangling">
            <label class="form-check-label" for="c6">Data Wrangling</label>
          </div></div>
          <div class="col"><div class="form-check">
            <input class="form-check-input core" type="checkbox" id="c7" name="bais_core" value="Data Mining">
            <label class="form-check-label" for="c7">Data Mining</label>
          </div></div>
          <div class="col"><div class="form-check">
            <input class="form-check-input core" type="checkbox" id="c8" name="bais_core" value="BAIS Capstone">
            <label class="form-check-label" for="c8">BAIS Capstone</label>
          </div></div>
        </div>
        <div class="invalid-feedback d-block" id="coreFeedback" style="display:none">
          Please select at least one class.
        </div>
      </fieldset>

      <div class="d-flex justify-content-between align-items-center mt-4">
        <small class="text-muted">page 2 of 2</small>
        <div class="d-flex gap-2">
          <a class="btn btn-outline-secondary" href="hawkid_p1.html">Back</a>
          <button class="btn btn-success" type="submit">Finish</button>
        </div>
      </div>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Carry forward params from page 1 as hidden inputs
    (function carryForward(){
      const params = new URLSearchParams(location.search);
      const carry = document.getElementById('carry');
      for (const [k,v] of params.entries()){
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = k;
        input.value = v;
        carry.appendChild(input);
      }
    })();

    // Validate: year required (HTML handles), at least one core checkbox required
    const form = document.getElementById('p2form');
    const coreBoxes = Array.from(document.querySelectorAll('.core'));
    form.addEventListener('submit', function(ev){
      const anyCore = coreBoxes.some(cb => cb.checked);
      document.getElementById('coreFeedback').style.display = anyCore ? 'none' : 'block';

      // If radios invalid, show message (Bootstrap will handle highlighting)
      const yearChecked = !!document.querySelector('input[name="year"]:checked');
      document.getElementById('yearFeedback').style.display = yearChecked ? 'none' : 'block';

      if (!anyCore || !yearChecked) {
        ev.preventDefault();
        ev.stopPropagation();
      }
      form.classList.add('was-validated');
    });
  </script>
</body>
</html>
