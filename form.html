<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>BAIS Survey — Page 1 of 2</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    .shell { max-width: 640px; }
  </style>
</head>
<body>
  <main class="container my-4 shell">
    <h1 class="h3 text-center mb-4">Business Analytics<br>Student Survey</h1>
    <form action="hawkid_p2.html" method="get" class="needs-validation" novalidate>
      <!-- Home country (autofocus, optional per spec) -->
      <div class="mb-3">
        <label for="country" class="form-label">My home country is</label>
        <input id="country" name="country" type="text" class="form-control" list="countries" autofocus>
        <datalist id="countries">
          <option value="United States"><option value="Canada"><option value="Mexico">
          <option value="China"><option value="India"><option value="Germany">
          <option value="United Kingdom"><option value="Brazil"><option value="Nigeria">
        </datalist>
      </div>

      <!-- Home town (required + tooltip) -->
      <div class="mb-3">
        <label for="town" class="form-label">
          My home town is
          <button type="button" class="btn btn-sm btn-outline-secondary ms-1"
                  data-bs-toggle="tooltip" data-bs-placement="top"
                  title="What town did you live in before coming to college?">
            <i class="fa-solid fa-circle-question" aria-hidden="true"></i>
            <span class="visually-hidden">Help</span>
          </button>
          <span class="text-danger ms-1">Required field</span>
        </label>
        <input id="town" name="town" type="text" class="form-control" required aria-required="true">
        <div class="invalid-feedback">Please enter your home town.</div>
      </div>

      <!-- Home state (optional select) -->
      <div class="mb-3">
        <label for="state" class="form-label">My home state is</label>
        <select id="state" name="state" class="form-select">
          <option value="" selected>— Select —</option>
          <option>AL</option><option>AK</option><option>AZ</option><option>AR</option>
          <option>CA</option><option>CO</option><option>CT</option><option>DE</option>
          <option>FL</option><option>GA</option><option>IA</option><option>IL</option>
          <option>IN</option><option>KS</option><option>KY</option><option>LA</option>
          <option>MA</option><option>MD</option><option>MI</option><option>MN</option>
          <option>MO</option><option>MS</option><option>NC</option><option>ND</option>
          <option>NE</option><option>NH</option><option>NJ</option><option>NM</option>
          <option>NV</option><option>NY</option><option>OH</option><option>OK</option>
          <option>OR</option><option>PA</option><option>RI</option><option>SC</option>
          <option>SD</option><option>TN</option><option>TX</option><option>UT</option>
          <option>VA</option><option>VT</option><option>WA</option><option>WI</option>
          <option>WV</option><option>WY</option><option>Non-U.S.</option>
        </select>
      </div>

      <!-- Likert (required) -->
      <div class="mb-3">
        <label for="impression" class="form-label">
          My impression of the BAIS major is
          <span class="text-danger ms-1">Required field</span>
        </label>
        <select id="impression" name="impression" class="form-select" required aria-required="true">
          <option value="" selected disabled>— Select —</option>
          <option value="5">Very positive (5)</option>
          <option value="4">Somewhat positive (4)</option>
          <option value="3">Neutral (3)</option>
          <option value="2">Somewhat negative (2)</option>
          <option value="1">Very negative (1)</option>
        </select>
        <div class="invalid-feedback">Please select your impression.</div>
        <div class="form-text">Likert scale: 5 to 1 as shown.</div>
      </div>

      <div class="d-flex justify-content-between align-items-center mt-4">
        <small class="text-muted">page 1 of 2</small>
        <button class="btn btn-primary">Next</button>
      </div>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // enable tooltips
    document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(el => new bootstrap.Tooltip(el));
    // basic Bootstrap validation
    (() => {
      const form = document.querySelector('.needs-validation');
      form.addEventListener('submit', e => {
        if (!form.checkValidity()) { e.preventDefault(); e.stopPropagation(); }
        form.classList.add('was-validated');
      }, false);
    })();
  </script>
</body>
</html>
